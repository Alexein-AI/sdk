[project]
name = "twinmemory"
version = "0.1.0"
description = "Python client for twin memory: long-term memory for your users and agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alexein AI" }]
keywords = ["memory", "llm", "agents", "ai", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# httpx alone: sync and async over one pool, timeouts and a mock transport for tests.
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://twinmemory.dev"
Documentation = "https://twinmemory.dev/docs/sdks/python"
Repository = "https://github.com/Alexein-AI/twin-memory-python"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinmemory"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["twinmemory"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
