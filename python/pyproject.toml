[project]
name = "alexein"
version = "0.3.0"
description = "Python client for Alexein: long-term memory for your app users and agents, with LangGraph, OpenAI Agents SDK and CrewAI integrations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alexein AI" }]
keywords = ["memory", "llm", "agents", "ai", "rag", "langgraph", "crewai", "openai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# httpx alone: sync and async over one pool, timeouts and a mock transport for tests.
dependencies = ["httpx>=0.27,<1"]

# The integrations' frameworks, each only for the module that needs it: `import alexein` never
# imports one.
[project.optional-dependencies]
langgraph = ["langgraph>=1", "langchain>=1"]
openai-agents = ["openai-agents>=0.24"]
crewai = ["crewai>=1.15,<1.16"]

[project.urls]
Homepage = "https://alexein.ai"
Documentation = "https://docs.alexein.ai/sdks/python"
Repository = "https://github.com/Alexein-AI/sdk"
Changelog = "https://github.com/Alexein-AI/sdk/blob/main/python/CHANGELOG.md"

[dependency-groups]
# The frameworks, to run the integrations in tests. CrewAI 1.15 needs openai<3 and the OpenAI
# Agents SDK since 0.21 needs openai>=3, so the two are groups that never share an environment:
# the tests run once with each (`crewai`, a default group, and `openai-agents`). The SDK's 0.24
# for its scripted model, `agents.testing`.
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "pyright>=1.1.380", "langgraph>=1", "langchain>=1"]
crewai = ["crewai>=1.15,<1.16"]
openai-agents = ["openai-agents>=0.24"]

[tool.uv]
default-groups = ["dev", "crewai"]
conflicts = [
    [{ group = "crewai" }, { group = "openai-agents" }],
    [{ extra = "crewai" }, { extra = "openai-agents" }],
    [{ extra = "crewai" }, { group = "openai-agents" }],
    [{ group = "crewai" }, { extra = "openai-agents" }],
]
# CrewAI pulls in onnxruntime, whose releases after 1.23 have no wheel for Python 3.10 on Linux,
# so CI's 3.10 job could not install.
constraint-dependencies = ["onnxruntime<1.24; python_version < '3.11'"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexein"]

# The sdist holds what a customer needs: the package, its README, CHANGELOG and LICENSE. Hatchling
# always adds pyproject.toml and .gitignore.
[tool.hatch.build.targets.sdist]
only-include = ["src/alexein", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["alexein"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The frameworks' own deprecations, and CrewAI's note that a test's bound callbacks are not
# checkpointed, are theirs, not this package's.
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:A method callback cannot be saved:UserWarning",
]
