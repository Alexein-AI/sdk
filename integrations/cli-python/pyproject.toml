[project]
name = "alexein-cli"
version = "0.3.0"
description = "Add memory from Alexein to a LangGraph project, a CrewAI crew or an OpenAI Agents SDK agent, as a short file you own: uvx alexein-cli init langgraph | crewai | openai-agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alexein AI" }]
keywords = ["memory", "llm", "agents", "langgraph", "crewai", "openai-agents", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The client, for the key's check; everything else is the standard library. The CLI never
# imports a framework: the files it writes do, through the client's extras.
dependencies = ["alexein>=0.3"]

[project.scripts]
alexein-cli = "alexein_cli:main"

[project.urls]
Homepage = "https://alexein.ai"
Documentation = "https://docs.alexein.ai/integrations/langgraph"
Repository = "https://github.com/Alexein-AI/sdk"
Changelog = "https://github.com/Alexein-AI/sdk/blob/main/integrations/cli-python/CHANGELOG.md"

[dependency-groups]
# The frameworks only to run the written files in tests; the CLI never imports them. CrewAI 1.15
# needs openai<3 and the OpenAI Agents SDK since 0.21 needs openai>=3, so the two are groups that
# never share an environment: CI runs the tests once with each (`--group crewai`, `--group
# openai-agents`). The SDK's 0.24 for its scripted model, `agents.testing`.
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "pyright>=1.1.380", "langgraph>=1", "langchain>=1"]
crewai = ["crewai>=1.15,<1.16"]
openai-agents = ["openai-agents>=0.24"]

[tool.uv]
default-groups = ["dev", "crewai"]
conflicts = [[{ group = "crewai" }, { group = "openai-agents" }]]
# CrewAI (a dev dependency, for the tests) pulls in onnxruntime, whose releases after
# 1.23 have no wheel for Python 3.10 on Linux, so CI's 3.10 job could not install.
constraint-dependencies = ["onnxruntime<1.24; python_version < '3.11'"]

# The client from this repository while developing, so the CLI is tested against the alexein
# it ships beside. A published build depends on alexein from PyPI, as `dependencies` says.
[tool.uv.sources]
alexein = { path = "../../python", editable = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexein_cli"]

# The source distribution holds what the wheel is built from and the pages a user reads: no
# tests, lock file or CONTRIBUTING.md. pyproject.toml and PKG-INFO are always added.
[tool.hatch.build.targets.sdist]
include = ["/src/alexein_cli", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["alexein_cli"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The frameworks' own deprecations are theirs, not this package's.
filterwarnings = ["ignore::DeprecationWarning"]
