[project]
name = "twinmemory-cli"
version = "0.1.0"
description = "Add memory from Alexein to a LangGraph project, a CrewAI crew or an OpenAI Agents SDK agent, as code you own: uvx twinmemory-cli init langgraph | crewai | openai-agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alexein AI" }]
keywords = ["memory", "llm", "agents", "langgraph", "crewai", "openai-agents", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The client, for the key's check; everything else is the standard library.
dependencies = ["twinmemory>=0.2"]

[project.scripts]
twinmemory-cli = "twinmemory_cli:main"

[project.urls]
Homepage = "https://alexein.ai"
Documentation = "https://docs.alexein.ai/integrations/langgraph"
Repository = "https://github.com/Alexein-AI/twin-memory-integrations"

[dependency-groups]
# The frameworks only to run the written files in tests; the CLI never imports them. CrewAI 1.15
# needs openai<3 and the OpenAI Agents SDK since 0.21 needs openai>=3, so the two are groups that
# never share an environment: CI runs the tests once with each (`--group crewai`, `--group
# openai-agents`). The SDK's 0.24 for its scripted model, `agents.testing`.
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "pyright>=1.1.380", "langgraph>=1", "langchain>=1"]
crewai = ["crewai>=1.15,<1.16"]
openai-agents = ["openai-agents>=0.24"]

[tool.uv]
default-groups = ["dev", "crewai"]
conflicts = [[{ group = "crewai" }, { group = "openai-agents" }]]
# CrewAI (a dev dependency, for the tests) pulls in onnxruntime, whose releases after
# 1.23 have no wheel for Python 3.10 on Linux, so CI's 3.10 job could not install.
constraint-dependencies = ["onnxruntime<1.24; python_version < '3.11'"]

# Until twinmemory is on PyPI, the wheel in vendor/ (scripts/vendor-clients.sh builds it). Then
# this goes, and the dependency above is met from PyPI.
[tool.uv.sources]
twinmemory = { path = "../../vendor/twinmemory-0.2.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinmemory_cli"]

# The source distribution holds what the wheel is built from and the pages a user reads: no
# tests, lock file or CONTRIBUTING.md. pyproject.toml and PKG-INFO are always added.
[tool.hatch.build.targets.sdist]
include = ["/src/twinmemory_cli", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["twinmemory_cli"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
