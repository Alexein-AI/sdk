# A private npm registry and a private PyPI, on this machine only, to publish Alexein's packages to
# before they are published for real - so the docs' own commands (uvx alexein-cli ..., npx @alexein/cli ...) can be
# followed word for word. Nothing here talks to npmjs.org or pypi.org on our packages' behalf: they are
# published here and only here. Everything else is fetched from the real registries as usual.
#
#   docker compose up -d       start
#   docker compose down -v     stop, and forget everything published
name: alexein-rehearsal

services:
  npm:
    image: verdaccio/verdaccio:6
    ports: ["127.0.0.1:4873:4873"]
    volumes:
      - ./verdaccio.yaml:/verdaccio/conf/config.yaml:ro
      - npm-storage:/verdaccio/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4873/-/ping"]
      interval: 5s
      retries: 20

  pypi:
    image: pypiserver/pypiserver:v2.3.2
    # -P . -a . : no password to upload or read; it listens on 127.0.0.1 only.
    command: ["run", "-p", "8080", "-P", ".", "-a", ".", "--overwrite", "/data/packages"]
    ports: ["127.0.0.1:8070:8080"]
    volumes:
      - pypi-packages:/data/packages

volumes:
  npm-storage:
  pypi-packages:
