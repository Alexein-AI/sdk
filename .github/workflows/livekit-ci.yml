# alexein-livekit (integrations/livekit). It depends on the alexein client from this repository,
# ../../python, editable (pyproject's [tool.uv.sources]), so a change to the client or to the API's
# contract runs these tests too. A release workflow, when there is one, publishes on a tag
# livekit-v<version>, after alexein is on PyPI.
name: livekit-ci

on:
  pull_request:
    paths:
      - "integrations/livekit/**"
      - "python/**"
      - "contract/**"
      - ".github/workflows/livekit-ci.yml"
  push:
    branches: [main]
    paths:
      - "integrations/livekit/**"
      - "python/**"
      - "contract/**"
      - ".github/workflows/livekit-ci.yml"

concurrency:
  group: livekit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/livekit

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest -q
      # The oldest LiveKit Agents it supports, as pyproject's floor says.
      - run: uv run --with "livekit-agents==1.5.1" pytest -q
