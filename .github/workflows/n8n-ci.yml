name: n8n

on:
  pull_request:
    paths: ["integrations/n8n/**", "contract/**", ".github/workflows/n8n-*.yml"]
  push:
    branches: [main]
    paths: ["integrations/n8n/**", "contract/**", ".github/workflows/n8n-*.yml"]
  workflow_dispatch:

concurrency:
  group: n8n-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/n8n

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: integrations/n8n/package-lock.json
      - run: npm ci
      - run: npx prettier --check nodes credentials test e2e
      - run: npm run lint
      # Builds, then the unit tests, which also check every route and field against contract/.
      - run: npm test
