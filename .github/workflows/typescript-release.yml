# Publishes @alexein/sdk to npm when a tag like typescript-v0.3.0 is pushed, with provenance,
# through npm's trusted publisher (npm package settings, repository Alexein-AI/sdk, workflow
# typescript-release.yml, environment npm). That needs npm 11.5.1 or later: Node 22's npm 10 has no
# token to log in with (typescript-v0.3.1's first run). A manual run (workflow_dispatch) checks and
# packs, and publishes nothing.
name: typescript-release

on:
  push:
    tags: ["typescript-v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: the tag is the package's version
        if: github.event_name == 'push'
        run: test "typescript-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run
      - if: github.event_name == 'push'
        run: npm publish --provenance --access public
