# Publishes alexein-cli (integrations/cli-python/) to PyPI when a tag like cli-python-v0.3.0 is pushed, through PyPI trusted
# publishing: no token is stored anywhere. Before the first release, on pypi.org add a pending
# publisher for project `alexein-cli`, owner `Alexein-AI`, repository `sdk`, workflow
# `cli-python-release.yml`, environment `pypi`. A manual run (workflow_dispatch) publishes to TestPyPI
# instead. Release `alexein` (python-v*) first: the wheel built here is installed from PyPI alone
# before it is published, so a release whose `alexein` is not out yet stops here.
name: cli-python-release

on:
  push:
    tags: ["cli-python-v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/cli-python

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: the tag is the package's version
        if: github.event_name == 'push'
        run: |
          version=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "cli-python-v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} is not cli-python-v$version"; exit 1; }
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv build
      - name: the wheel installs from PyPI alone
        if: github.event_name == 'push'
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/fresh"
          uv pip install --python "$RUNNER_TEMP/fresh" dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: integrations/cli-python/dist/

  pypi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
