# alexein-cli for Python (integrations/cli-python). It is tested against the alexein client in
# python/ (a path source in its pyproject.toml), and that client against the API contract in
# contract/, so a change to any of the three runs it. A release is tagged cli-python-v<version>
# (a release workflow is cli-python-release.yml's to add), after the alexein it needs is on PyPI.
name: cli-python

on:
  pull_request:
    paths:
      - "integrations/cli-python/**"
      - "python/**"
      - "contract/**"
      - ".github/workflows/cli-python-*.yml"
  push:
    branches: [main]
    paths:
      - "integrations/cli-python/**"
      - "python/**"
      - "contract/**"
      - ".github/workflows/cli-python-*.yml"

concurrency:
  group: cli-python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/cli-python

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        # CrewAI and the OpenAI Agents SDK need different majors of openai: one run with each.
        group: ["crewai", "openai-agents"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --no-default-groups --group dev --group ${{ matrix.group }}
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync pytest -q
