name: typescript-ci

on:
  push:
    branches: [main]
    paths: ["typescript/**", "contract/**", ".github/workflows/typescript-ci.yml"]
  pull_request:
    paths: ["typescript/**", "contract/**", ".github/workflows/typescript-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx prettier --check .
      - run: npx vitest run
      - run: npm run build
      # The built package, both ways it is loaded, and the main entry with no framework installed.
      - run: |
          node --input-type=module -e "import { Memory } from './dist/index.js'; new Memory({ apiKey: 'ak_x' })"
          node -e "const { Memory } = require('./dist/index.cjs'); new Memory({ apiKey: 'ak_x' })"
          node --input-type=module -e "import { AlexeinMemory } from './dist/langgraph.js'; new AlexeinMemory()"
          node -e "const { AlexeinMemory } = require('./dist/openai-agents.cjs'); new AlexeinMemory()"
          if grep -lE "@langchain|@openai|zod" dist/index.js dist/index.cjs; then exit 1; fi
      - run: npm pack --dry-run
