# Publishes @alexein/cli (integrations/cli-js/) to npm when a tag like cli-js-v0.3.0 is pushed, with
# provenance, through npm's trusted publisher (npm package settings, repository Alexein-AI/sdk,
# workflow cli-js-release.yml, environment npm). That needs npm 11.5.1 or later, hence lts/*.
# Release @alexein/sdk (typescript-v*) first and depend on it by version: `prepublishOnly` refuses a
# `file:` dependency. A manual run (workflow_dispatch) checks and packs, and publishes nothing.
name: cli-js-release

on:
  push:
    tags: ["cli-js-v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/cli-js

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: integrations/cli-js/package-lock.json
      - name: the tag is the package's version
        if: github.event_name == 'push'
        run: test "cli-js-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Both: package.json asks for a version, and the lockfile - which `npm ci` follows exactly -
      # resolves it from the registry. `npm install` after changing package.json keeps a lock entry
      # that still satisfies the range, so the folder could stay pinned (cli-js-v0.3.0's first run).
      - name: '@alexein/sdk comes from npm, by version'
        run: |
          node -e "
            const dep = require('./package.json').dependencies['@alexein/sdk'];
            const lock = require('./package-lock.json').packages['node_modules/@alexein/sdk'] ?? {};
            const fromNpm = String(lock.resolved ?? '').startsWith('https://registry.npmjs.org/');
            if (/^file:/.test(dep) || !fromNpm) {
              console.error('@alexein/sdk: package.json says ' + dep + ', the lockfile resolves ' + lock.resolved);
              console.error('in integrations/cli-js: npm uninstall @alexein/sdk && npm install --install-links=false @alexein/sdk@^<version>');
              process.exit(1);
            }"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run
      - if: github.event_name == 'push'
        run: npm publish --provenance --access public
